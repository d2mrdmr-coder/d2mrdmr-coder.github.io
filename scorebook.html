    <script>
        let currentLang = 'en';
        let currentRound = 1;
        let players = [
            { id: 1, name: 'Player 1', score: 10, color: 'purple', history: [] },
            { id: 2, name: 'Player 2', score: 5, color: 'blue', history: [] }

        let nextPlayerId = 3;
        let actionHistory = [];
        let roundHistory = [];

        // Active Player History modal state
        let activeHistoryPlayerId = null;
        let playerHistoryViewMode = 'ops'; // 'ops' or 'results'

        const MIN_SCORE = -999999;
        const MAX_SCORE = 99999999;

        // Cookie management helper functions
        function setCookie(name, value, days = 365) {
            const d = new Date();
            d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
            let expires = "expires=" + d.toUTCString();
            document.cookie = name + "=" + encodeURIComponent(JSON.stringify(value)) + ";" + expires + ";path=/;SameSite=Lax";
        }

        function getCookie(name) {
            let nameEQ = name + "=";
            let ca = document.cookie.split(';');
            for(let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) == ' ') c = c.substring(1, c.length);
                if (c.indexOf(nameEQ) == 0) {
                    try {
                        return JSON.parse(decodeURIComponent(c.substring(nameEQ.length, c.length)));
                    } catch(e) {
                        return null;
                    }
                }
            }
            return null;
        }

        function saveStateToCookies() {
            setCookie('ppm_lang', currentLang);
            setCookie('ppm_round', currentRound);
            setCookie('ppm_players', players);
            setCookie('ppm_nextId', nextPlayerId);
            setCookie('ppm_actionHistory', actionHistory);
            setCookie('ppm_roundHistory', roundHistory);
        }

        function loadStateFromCookies() {
            const savedLang = getCookie('ppm_lang');
            if (savedLang) currentLang = savedLang;

            const savedRound = getCookie('ppm_round');
            if (savedRound) currentRound = savedRound;

            const savedPlayers = getCookie('ppm_players');
            if (savedPlayers && Array.isArray(savedPlayers)) {
                players = savedPlayers;
            }

            const savedNextId = getCookie('ppm_nextId');
            if (savedNextId) nextPlayerId = savedNextId;

            const savedHistory = getCookie('ppm_actionHistory');
            if (savedHistory && Array.isArray(savedHistory)) {
                actionHistory = savedHistory;
            }

            const savedRoundHistory = getCookie('ppm_roundHistory');
            if (savedRoundHistory && Array.isArray(savedRoundHistory)) {
                roundHistory = savedRoundHistory;
            }
        }

                historySubtitle: "Журнал операцій та розрахунків балів",
                modeOps: "Операції (+, -, *, /)",
                modeResults: "Історія результатів",

                limitError: "Помилка: Перевищено ліміт балів (-999 999 до +99 999 999). Значення скинуто до 0!",
                roundsModalTitle: "Історія раундів",

                clearRounds: "Очистити",

        const colorClasses = [
            { id: 'purple', bg: 'border-purple-500 bg-purple-50/40 dark:bg-purple-950/20' },
            { id: 'blue', bg: 'border-sky-500 bg-sky-50/40 dark:bg-sky-950/20' },

            { id: 'red', bg: 'border-rose-500 bg-rose-50/40 dark:bg-rose-950/20' }
        ];

        function addActionLog(actionType, details) {
            const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            actionHistory.unshift({ time: timeStr, type: actionType, details: details });
            if (actionHistory.length > 50) actionHistory.pop();
            renderHistoryList();
            saveStateToCookies();
        }

        function toggleGlobalHistoryModal() {
            const modal = document.getElementById('historyModal');
            if (modal) modal.classList.toggle('hidden');
        }

        function clearHistory() {
            actionHistory = [];
            renderHistoryList();
            saveStateToCookies();
        }

        function renderHistoryList() {
            const container = document.getElementById('historyListContainer');
            const badge = document.getElementById('historyCountBadge');
            const t = translations[currentLang];
            if (badge) badge.innerText = actionHistory.length;
            if (!container) return;

            if (actionHistory.length === 0) {
                container.innerHTML = `<div class="text-center py-10 text-xs text-slate-400 dark:text-slate-600 font-medium">${t.noHistory}</div>`;
                return;
            }

            let html = '';
            actionHistory.forEach(item => {
                html += `
                    <div class="flex items-start justify-between gap-2 p-2.5 bg-slate-100 dark:bg-slate-950/60 border border-slate-200/80 dark:border-slate-800/80 rounded-xl text-xs">
                        <div class="flex flex-col gap-0.5">
                            <span class="font-bold text-slate-800 dark:text-white">${item.type}</span>
                            <span class="text-[11px] text-slate-500 dark:text-slate-400">${item.details}</span>
                        </div>
                        <span class="text-[10px] text-slate-400 dark:text-slate-500 shrink-0 font-mono">${item.time}</span>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // Round History Management & Finish Round
        function finishRound() {
            if (players.length === 0) return;

            // Find winner(s) and loser(s)
            let maxScore = players[0].score;
            let minScore = players[0].score;
            players.forEach(p => {
                if (p.score > maxScore) maxScore = p.score;
                if (p.score < minScore) minScore = p.score;
            });

            const roundSnapshot = {
                roundNumber: currentRound,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
                date: new Date().toLocaleDateString(),
                playersSnapshot: players.map(p => ({
                    name: p.name,
                    score: p.score,
                    isWinner: p.score === maxScore,
                    isLoser: p.score === minScore && players.length > 1
                }))
            };

            roundHistory.unshift(roundSnapshot);
            if (roundHistory.length > 30) roundHistory.pop();

            const t = translations[currentLang];
            addActionLog(t.actFinishRound, `Round #${currentRound} finished. Winner score: ${maxScore}`);

            currentRound++;
            renderAll();
            saveStateToCookies();

            // Open round history modal automatically to show results
            toggleRoundHistoryModal();
        }

        function toggleRoundHistoryModal() {
            const modal = document.getElementById('roundHistoryModal');
            if (modal) {
                modal.classList.toggle('hidden');
                if (!modal.classList.contains('hidden')) {
                    renderRoundHistoryContent();
                }
            }
        }

        function clearRoundHistory() {
            roundHistory = [];
            renderRoundHistoryContent();
            saveStateToCookies();
        }

        function renderRoundHistoryContent() {
            const container = document.getElementById('roundHistoryContentList');
            const t = translations[currentLang];
            if (!container) return;

            if (roundHistory.length === 0) {
                container.innerHTML = `<div class="text-center py-16 text-xs text-slate-400 dark:text-slate-500 font-medium">${t.noRounds}</div>`;
                return;
            }

            let html = '';
            roundHistory.forEach(r => {
                let playersHtml = '';
                r.playersSnapshot.forEach(ps => {
                    let badge = '';
                    if (ps.isWinner) badge = `<span class="px-2 py-0.5 bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border border-emerald-500/30 text-[10px] font-extrabold rounded-lg">${t.winner}</span>`;
                    else if (ps.isLoser) badge = `<span class="px-2 py-0.5 bg-rose-500/10 text-rose-600 dark:text-rose-400 border border-rose-500/30 text-[10px] font-extrabold rounded-lg">${t.loser}</span>`;

                    playersHtml += `
                        <div class="flex items-center justify-between py-1.5 px-3 bg-slate-100 dark:bg-slate-900/80 rounded-xl">
                            <div class="flex items-center gap-2">
                                <span class="text-xs font-bold text-slate-700 dark:text-slate-200">${ps.name}</span>
                                ${badge}
                            </div>
                            <span class="text-xs font-extrabold text-purple-600 dark:text-purple-400 font-mono">${ps.score}</span>
                        </div>
                    `;
                });

                html += `
                    <div class="flex flex-col gap-2.5 p-4 bg-slate-50 dark:bg-slate-950/70 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-sm">
                        <div class="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-2">
                            <span class="text-xs font-bold text-purple-600 dark:text-purple-400">Round #${r.roundNumber}</span>
                            <span class="text-[10px] text-slate-400 font-mono">${r.date} ${r.time}</span>
                        </div>
                        <div class="text-[11px] font-semibold text-slate-500 dark:text-slate-400">${t.playerScoresAtEnd}</div>
                        <div class="flex flex-col gap-1.5">
                            ${playersHtml}
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // Open individual player history modal
        function openPlayerHistory(playerId) {
            activeHistoryPlayerId = playerId;
            playerHistoryViewMode = 'ops';
            const modal = document.getElementById('playerHistoryModal');
            if (modal) modal.classList.remove('hidden');
            renderPlayerHistoryModalContent();
        }

        function closePlayerHistoryModal() {
            const modal = document.getElementById('playerHistoryModal');
            if (modal) modal.classList.add('hidden');
            activeHistoryPlayerId = null;
        }

        function setPlayerHistoryMode(mode) {
            playerHistoryViewMode = mode;
            const opsBtn = document.getElementById('toggleOpsBtn');
            const resBtn = document.getElementById('toggleResBtn');

            if (mode === 'ops') {
                opsBtn.className = "flex-1 py-2.5 px-3 rounded-xl text-xs font-bold transition-all bg-white dark:bg-slate-900 text-purple-600 dark:text-purple-400 shadow-sm flex items-center justify-center gap-1.5";
                resBtn.className = "flex-1 py-2.5 px-3 rounded-xl text-xs font-bold transition-all text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white flex items-center justify-center gap-1.5";
            } else {
                resBtn.className = "flex-1 py-2.5 px-3 rounded-xl text-xs font-bold transition-all bg-white dark:bg-slate-900 text-purple-600 dark:text-purple-400 shadow-sm flex items-center justify-center gap-1.5";
                opsBtn.className = "flex-1 py-2.5 px-3 rounded-xl text-xs font-bold transition-all text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white flex items-center justify-center gap-1.5";
            }

            renderPlayerHistoryModalContent();
        }

        function renderPlayerHistoryModalContent() {
            const container = document.getElementById('playerHistoryContentList');
            const titleEl = document.getElementById('modalPlayerTitle');
            if (!container) return;

            const player = players.find(p => p.id === activeHistoryPlayerId);
            const t = translations[currentLang];
            if (!player) return;

            if (titleEl) titleEl.innerText = `${player.name} — History`;

            if (!player.history || player.history.length === 0) {
                container.innerHTML = `<div class="text-center py-16 text-xs text-slate-400 dark:text-slate-500 font-medium">${t.noPlayerHistory}</div>`;
                return;
            }

            let html = '';
            player.history.forEach((entry, idx) => {
                const timeStr = entry.time;
                if (playerHistoryViewMode === 'ops') {
                    let badgeColor = 'bg-purple-500/10 text-purple-600 dark:text-purple-400 border-purple-500/30';
                    if (entry.delta < 0) badgeColor = 'bg-rose-500/10 text-rose-600 dark:text-rose-400 border-rose-500/30';
                    if (entry.delta === 0) badgeColor = 'bg-amber-500/10 text-amber-600 dark:text-amber-400 border-amber-500/30';

                    html += `
                        <div class="flex items-center justify-between p-3.5 bg-slate-50 dark:bg-slate-950/70 border border-slate-200 dark:border-slate-800 rounded-2xl">
                            <div class="flex items-center gap-3">
                                <span class="px-3 py-1.5 rounded-xl text-xs font-extrabold border ${badgeColor} font-mono">${entry.operation}</span>
                                <div class="flex flex-col">
                                    <span class="text-xs font-bold text-slate-800 dark:text-white">${entry.desc}</span>
                                    <span class="text-[10px] text-slate-400 font-mono">${timeStr}</span>
                                </div>
                            </div>
                            <span class="text-xs font-bold text-slate-500 dark:text-slate-400">Step #${player.history.length - idx}</span>
                        </div>
                    `;
                } else {
                    html += `
                        <div class="flex items-center justify-between p-3.5 bg-slate-50 dark:bg-slate-950/70 border border-slate-200 dark:border-slate-800 rounded-2xl">
                            <div class="flex flex-col gap-0.5">
                                <span class="text-xs font-bold text-slate-800 dark:text-white">Score after: ${entry.desc}</span>
                                <span class="text-[10px] text-slate-400 font-mono">${timeStr}</span>
                            </div>
                            <div class="flex items-center gap-1.5 bg-purple-600/10 dark:bg-purple-950/50 border border-purple-500/30 px-3 py-1.5 rounded-xl">
                                <span class="text-[10px] uppercase font-bold text-purple-600 dark:text-purple-400">Result:</span>
                                <span class="text-sm font-extrabold text-purple-700 dark:text-purple-300 font-mono">${entry.resultingScore}</span>
                            </div>
                        </div>
                    `;
                }
            });
            container.innerHTML = html;
        }

        function toggleLanguage() {
            currentLang = (currentLang === 'en') ? 'uk' : 'en';
            applyLanguage();
            saveStateToCookies();
        }

        function applyLanguage() {
            const t = translations[currentLang];

            document.querySelectorAll('[data-i18n-history-btn]').forEach(el => el.innerText = t.historyBtn);

            document.querySelectorAll('[data-i18n-add-player]').forEach(el => el.innerText = t.addPlayer);

            document.querySelectorAll('[data-i18n-players-list]').forEach(el => el.innerText = t.playersList);

            document.querySelectorAll('[data-i18n-history-subtitle]').forEach(el => el.innerText = t.historySubtitle);
            document.querySelectorAll('[data-i18n-mode-ops]').forEach(el => el.innerText = t.modeOps);
            document.querySelectorAll('[data-i18n-mode-results]').forEach(el => el.innerText = t.modeResults);
            document.querySelectorAll('[data-i18n-rounds-modal-title]').forEach(el => el.innerText = t.roundsModalTitle);
            document.querySelectorAll('[data-i18n-rounds-modal-subtitle]').forEach(el => el.innerText = t.roundsModalSubtitle);
            document.querySelectorAll('[data-i18n-clear-rounds]').forEach(el => el.innerText = t.clearRounds);

            renderAll();
            if (activeHistoryPlayerId !== null) {
                renderPlayerHistoryModalContent();

        }

        function openAddPlayerModal() {
            const modal = document.getElementById('addPlayerModal');
            const input = document.getElementById('newPlayerNameInput');
            if (modal) modal.classList.remove('hidden');
            if (input) {
                input.value = `Player ${players.length + 1}`;
                input.focus();
            }
        }

        function closeAddPlayerModal() {
            const modal = document.getElementById('addPlayerModal');
            if (modal) modal.classList.add('hidden');
        }

        function confirmAddPlayer() {
            const input = document.getElementById('newPlayerNameInput');
            const name = input && input.value.trim() ? input.value.trim() : `Player ${players.length + 1}`;
            const colorObj = colorClasses[players.length % colorClasses.length];

            const newPlayer = {
                id: nextPlayerId++,
                name: name,
                score: 0,
                color: colorObj.id,
                history: []
            };

            players.push(newPlayer);
            const t = translations[currentLang];
            addActionLog(t.actAdd, newPlayer.name);

            closeAddPlayerModal();
            renderAll();
            saveStateToCookies();
        }

        function toggleSettingsModal() {
            const modal = document.getElementById('settingsModal');
            if (modal) {
                modal.classList.toggle('hidden');
                if (!modal.classList.contains('hidden')) {
                    renderSettingsPlayersList();
                }
            }
        }

        function renderSettingsPlayersList() {
            const container = document.getElementById('settingsPlayersList');
            if (!container) return;
            if (players.length === 0) {
                container.innerHTML = `<div class="text-xs text-slate-400 text-center py-4">No players</div>`;
                return;
            }

            let html = '';
            players.forEach((p, idx) => {
                html += `
                    <div class="flex items-center justify-between p-2 bg-slate-100 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl gap-2">
                        <div class="flex items-center gap-1.5 min-w-0">
                            <span class="text-[10px] text-slate-400 font-mono">#${idx + 1}</span>
                            <span class="text-xs font-semibold text-slate-700 dark:text-slate-300 truncate max-w-[130px]">${p.name}</span>
                        </div>
                        <div class="flex items-center gap-1 shrink-0">
                            <button onclick="movePlayerOrder(${p.id}, -1)" class="p-1 bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 text-slate-700 dark:text-slate-300 rounded-lg text-xs" title="Move Up">⬆️</button>
                            <button onclick="movePlayerOrder(${p.id}, 1)" class="p-1 bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 text-slate-700 dark:text-slate-300 rounded-lg text-xs" title="Move Down">⬇️</button>
                            <button onclick="removePlayer(${p.id})" class="px-2 py-1 bg-rose-500/10 hover:bg-rose-500/20 text-rose-600 dark:text-rose-400 text-xs rounded-lg font-bold transition-all">🗑️</button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function movePlayerOrder(id, direction) {
            const index = players.findIndex(x => x.id === id);
            if (index < 0) return;
            const newIndex = index + direction;
            if (newIndex < 0 || newIndex >= players.length) return;

            // Swap positions
            const temp = players[index];
            players[index] = players[newIndex];
            players[newIndex] = temp;

            renderSettingsPlayersList();
            renderAll();
            saveStateToCookies();
        }

        function removePlayer(id) {
            const p = players.find(x => x.id === id);
            players = players.filter(x => x.id !== id);
            if (p) {
                const t = translations[currentLang];
                addActionLog(t.actRemove, p.name);
            }
            if (activeHistoryPlayerId === id) {
                closePlayerHistoryModal();
            }
            renderSettingsPlayersList();
            renderAll();
            saveStateToCookies();
        }

        // Custom error alert toast message (since alert() is banned)
        function showErrorMessage(message) {
            let toast = document.getElementById('errorToast');
            if (!toast) {
                const toastHTML = `
                    <div id="errorToast" class="fixed top-20 left-1/2 transform -translate-x-1/2 z-[100] bg-rose-600 text-white px-4 py-3 rounded-2xl shadow-2xl text-xs sm:text-sm font-bold flex items-center gap-2.5 transition-all duration-300 opacity-0 pointer-events-none">
                        <span>⚠️</span>
                        <span id="errorToastText"></span>
                    </div>
                `;
                document.body.insertAdjacentHTML('beforeend', toastHTML);
                toast = document.getElementById('errorToast');
            }

            const textEl = document.getElementById('errorToastText');
            if (textEl) textEl.innerText = message;

            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100', 'translate-y-1');

            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-1');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 3500);
        }

        function checkScoreLimit(p, operationStr) {
            const t = translations[currentLang];
            if (p.score < MIN_SCORE || p.score > MAX_SCORE) {
                p.score = 0;
                const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                p.history.unshift({
                    time: timeStr,
                    operation: 'LIMIT_EXCEEDED',
                    delta: 0,
                    desc: `${p.name} limit exceeded (${operationStr}) ➡️ Reset to 0`,
                    resultingScore: 0
                });
                addActionLog("Limit Exceeded", `${p.name} score out of bounds (${MIN_SCORE} to ${MAX_SCORE}). Reset to 0.`);
                showErrorMessage(t.limitError);
                saveStateToCookies();
                return true;
            }
            return false;
        }

        function resetPlayerScore(id) {
            const p = players.find(x => x.id === id);
            if (p) {
                p.score = 0;
                const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                
                p.history.unshift({
                    time: timeStr,
                    operation: 'RESET',
                    delta: 0,
                    desc: `${p.name} score reset to 0`,
                    resultingScore: 0
                });

                const t = translations[currentLang];
                addActionLog(t.actResetSingle, `${p.name} set to 0`);
                
                const card = document.querySelector(`[data-player-id="${id}"]`);
                if (card) {
                    card.classList.add('pulse-active');
                    setTimeout(() => card.classList.remove('pulse-active'), 400);
                }
            }
            renderAll();
            if (activeHistoryPlayerId === id) {
                renderPlayerHistoryModalContent();
            }
            saveStateToCookies();
        }

        function resetAllScores() {
            players.forEach(p => {
                p.score = 0;
                const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                p.history.unshift({
                    time: timeStr,
                    operation: 'RESET',
                    delta: 0,
                    desc: `All scores reset`,
                    resultingScore: 0
                });
            });
            const t = translations[currentLang];
            addActionLog(t.actReset, "All scores set to 0");
            renderAll();
            if (activeHistoryPlayerId !== null) {
                renderPlayerHistoryModalContent();
            }
            saveStateToCookies();
        }

        function renderAll() {
            const grid = document.getElementById('playersGrid');
            const leaderDisplay = document.getElementById('leaderNameDisplay');
            const roundDisplay = document.getElementById('currentRoundDisplay');
            if (!grid) return;
            grid.innerHTML = '';

            if (roundDisplay) roundDisplay.innerText = currentRound;

            if (players.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400 text-xs font-medium">No players added yet. Click "Add Player" below!</div>`;
                if (leaderDisplay) leaderDisplay.innerText = '-';
                return;
            }

            // Determine leader
            let leader = players[0];
            players.forEach(p => {
                if (p.score > leader.score) leader = p;
            });
            if (leaderDisplay) leaderDisplay.innerText = `${leader.name} (${leader.score})`;

            players.forEach((player, index) => {
                const colorObj = colorClasses.find(c => c.id === player.color) || colorClasses[0];

                const card = document.createElement('div');
                card.className = `w-full bg-white/90 dark:bg-slate-900/90 border ${colorObj.bg} rounded-2xl p-2.5 sm:p-4 flex flex-col gap-2.5 sm:gap-3 relative shadow-sm transition-all group`;
                card.dataset.playerId = player.id;

                card.innerHTML = `
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-1 min-w-0">
                            <span class="text-[10px] sm:text-xs font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500">#${index + 1}</span>
                            <span class="text-xs sm:text-sm font-extrabold text-slate-800 dark:text-white truncate">${player.name}</span>
                        </div>
                        <div class="flex items-center gap-1">
                            <button onclick="openPlayerHistory(${player.id})" class="px-1.5 py-0.5 sm:px-2 sm:py-1 bg-slate-200/80 dark:bg-slate-800 hover:bg-purple-600 hover:text-white text-slate-600 dark:text-slate-300 text-[10px] sm:text-[11px] font-semibold rounded-lg transition-all shadow-sm flex items-center gap-0.5 shrink-0" title="Player History">
                                <span>📜</span>
                            </button>
                            <button onclick="resetPlayerScore(${player.id})" class="px-1.5 py-0.5 sm:px-2 sm:py-1 bg-slate-200/80 dark:bg-slate-800 hover:bg-rose-600 hover:text-white text-slate-600 dark:text-slate-300 text-[10px] sm:text-[11px] font-semibold rounded-lg transition-all shadow-sm flex items-center gap-0.5 shrink-0" title="Reset score to 0">
                                <span>🔄</span> <span>0</span>
                            </button>
                        </div>
                    </div>

                    <div class="flex items-center justify-center py-1 sm:py-2">
                        <span class="text-3xl sm:text-4xl font-extrabold text-purple-600 dark:text-purple-400 tracking-tight font-mono">${player.score}</span>
                    </div>

                    <!-- Arithmetic & Set Operation Buttons (+, -, *, /, =) -->
                    <div class="grid grid-cols-5 gap-1 pt-1">
                        <button onclick="promptArithmetic(${player.id}, '+')" class="py-1.5 sm:py-2 bg-purple-600 hover:bg-purple-500 text-white rounded-xl text-[11px] sm:text-xs font-bold transition-all shadow-md shadow-purple-600/20 active:scale-95">+</button>
                        <button onclick="promptArithmetic(${player.id}, '-')" class="py-1.5 sm:py-2 bg-slate-200/80 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 rounded-xl text-[11px] sm:text-xs font-bold transition-all active:scale-95">-</button>
                        <button onclick="promptArithmetic(${player.id}, '*')" class="py-1.5 sm:py-2 bg-slate-200/80 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 rounded-xl text-[11px] sm:text-xs font-bold transition-all active:scale-95">×</button>
                        <button onclick="promptArithmetic(${player.id}, '/')" class="py-1.5 sm:py-2 bg-slate-200/80 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 rounded-xl text-[11px] sm:text-xs font-bold transition-all active:scale-95">÷</button>
                        <button onclick="promptArithmetic(${player.id}, '=')" class="py-1.5 sm:py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-[11px] sm:text-xs font-bold transition-all shadow-md shadow-indigo-600/20 active:scale-95">=</button>
                    </div>
                `;

                grid.appendChild(card);
            });
        }

        // Custom modal prompt for arithmetic or set operation input
        let pendingArithmeticPlayerId = null;
        let pendingArithmeticOperator = null;

        function promptArithmetic(id, operator) {
            pendingArithmeticPlayerId = id;
            pendingArithmeticOperator = operator;
            
            let modal = document.getElementById('arithmeticPromptModal');
            if (!modal) {
                const modalHTML = `
                    <div id="arithmeticPromptModal" class="fixed inset-0 pointer-events-none z-[90] flex items-center justify-center hidden bg-black/50 backdrop-blur-xs p-4">
                        <div class="pointer-events-auto bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-800 rounded-3xl max-w-xs w-full p-5 shadow-2xl flex flex-col gap-4 animate-in fade-in zoom-in-95 duration-200">
                            <div class="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-3">
                                <h3 id="arithmeticModalTitle" class="text-sm font-bold text-slate-800 dark:text-white">Enter value</h3>
                                <button onclick="closeArithmeticModal()" class="text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-white p-1">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                                </button>
                            </div>
                            <div class="flex flex-col gap-2">
                                <label id="arithmeticLabel" class="text-[11px] font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Value</label>
                                <input type="number" id="arithmeticValueInput" value="0" step="any" class="w-full bg-slate-100 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-xl px-3 py-2 text-sm font-mono text-slate-800 dark:text-white focus:outline-none focus:border-purple-500 font-medium">
                            </div>
                            <div class="flex gap-2 mt-1">
                                <button onclick="confirmArithmetic()" class="flex-1 py-2.5 bg-purple-600 hover:bg-purple-500 text-white font-semibold rounded-xl text-xs transition-all shadow-md">OK</button>
                            </div>
                        </div>
                    </div>
                `;
                document.body.insertAdjacentHTML('beforeend', modalHTML);
                modal = document.getElementById('arithmeticPromptModal');
            }

            const titleEl = document.getElementById('arithmeticModalTitle');
            const labelEl = document.getElementById('arithmeticLabel');
            const inputEl = document.getElementById('arithmeticValueInput');

            const opNames = { '+': 'Addition (+)', '-': 'Subtraction (-)', '*': 'Multiplication (*)', '/': 'Division (/)', '=': 'Set Score (=)' };
            if (titleEl) titleEl.innerText = opNames[operator] || 'Operation';
            if (labelEl) labelEl.innerText = operator === '=' ? 'Set score to' : `Enter number for ${operator}`;
            if (inputEl) {
                inputEl.value = (operator === '*' || operator === '/') ? '2' : (operator === '=' ? '0' : '1');
                modal.classList.remove('hidden');
                setTimeout(() => {
                    inputEl.focus();
                    inputEl.select();
                }, 50);
            }
        }

        function closeArithmeticModal() {
            const modal = document.getElementById('arithmeticPromptModal');
            if (modal) modal.classList.add('hidden');
            pendingArithmeticPlayerId = null;
            pendingArithmeticOperator = null;
        }

        function confirmArithmetic() {
            const inputEl = document.getElementById('arithmeticValueInput');
            if (!inputEl || pendingArithmeticPlayerId === null || !pendingArithmeticOperator) return;

            const val = parseFloat(inputEl.value);
            if (isNaN(val)) {
                closeArithmeticModal();
                return;
            }

            const p = players.find(x => x.id === pendingArithmeticPlayerId);
            if (p) {
                let operationStr = '';

                if (pendingArithmeticOperator === '+') {
                    p.score += val;
                    operationStr = `+${val}`;
                } else if (pendingArithmeticOperator === '-') {
                    p.score -= val;
                    operationStr = `-${val}`;
                } else if (pendingArithmeticOperator === '*') {
                    p.score *= val;
                    operationStr = `*${val}`;
                } else if (pendingArithmeticOperator === '/') {
                    if (val === 0) {
                        closeArithmeticModal();
                        return; // Prevent division by zero
                    }
                    p.score = parseFloat((p.score / val).toFixed(2));
                    operationStr = `/${val}`;
                } else if (pendingArithmeticOperator === '=') {
                    p.score = val;
                    operationStr = `=${val}`;
                }

                const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                
                if (!checkScoreLimit(p, operationStr)) {
                    p.history.unshift({
                        time: timeStr,
                        operation: operationStr,
                        delta: val,
                        desc: `${p.name} (${operationStr})`,
                        resultingScore: p.score
                    });

                    const t = translations[currentLang];
                    addActionLog(t.actScore, `${p.name} (${operationStr}) ➡️ Score: ${p.score}`);
                }
                
                const card = document.querySelector(`[data-player-id="${pendingArithmeticPlayerId}"]`);
                if (card) {
                    card.classList.add('pulse-active');
                    setTimeout(() => card.classList.remove('pulse-active'), 400);
                }
            }

            closeArithmeticModal();
            renderAll();
            if (activeHistoryPlayerId === pendingArithmeticPlayerId) {
                renderPlayerHistoryModalContent();
            }
            saveStateToCookies();
        }

        window.onload = function() {
            loadStateFromCookies();
            applyLanguage();
        };
    </script>
</body>
</html>
